name: Bug report
description: Something in Opus doesn't work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Opus version and build
      description: Open Opus's menu (hold synth + drum + tape + mixer) and hold help, e.g. "opus 2, build 1" or "opus 1, build 90".
    validations:
      required: true
  - type: dropdown
    id: before
    attributes:
      label: What was on the OP-1 before Opus
      options:
        - stock 246
        - Opus 1
        - an older Opus 2
        - op1r
        - Hundekraft
        - another mod
        - not sure
    validations:
      required: true
  - type: textarea
    id: plugins
    attributes:
      label: Your plugins
      description: Which .opmod files are in the mods folder (Opus's menu, T2, lists them), and whether the bridge is in. If the mods list says a plugin was skipped or switched off, say which.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The keys you pressed, in order, as far as you remember.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: screen
    attributes:
      label: A photo of the screen
      description: If the OP-1 stopped at a black screen with white text, a photo of it helps most. Drag it in here.
